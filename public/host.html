<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>목적지 레이스 - 호스트 화면</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  html, body { margin:0; height:100%; background:#0b0f14; color:#fff; font-family: sans-serif; overflow:hidden; }
  #wrap { display:flex; height:100vh; }
  #stage { flex:3; position:relative; }
  canvas { width:100%; height:100%; display:block; background:#101720; }
  #side { flex:1; padding:24px; box-sizing:border-box; border-left:2px solid #223; display:flex; flex-direction:column; gap:16px; overflow:hidden; height:100vh; }
  #qr { background:#fff; padding:12px; border-radius:8px; width:fit-content; }
  h2 { margin:0 0 8px; font-size:20px; font-weight:500; }
  #url { font-size:14px; color:#9ab; word-break:break-all; }
  #rankWrap { flex:1; min-height:0; display:flex; flex-direction:column; }
  #rank { list-style:none; margin:0; padding:0; font-size:16px; line-height:1.7; overflow-y:auto; flex:1; min-height:0; }
  #rank li span.n { display:inline-block; width:32px; color:#5cf; font-weight:600; }
  #popup { position:absolute; top:20px; left:50%; transform:translateX(-50%); background:#1d9e75; color:#fff; padding:14px 28px; border-radius:10px; font-size:22px; font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none; }
  #popup.show { opacity:1; }
  button { flex-shrink:0; padding:10px; background:#223; color:#fff; border:1px solid #345; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="track"></canvas>
    <div id="popup"></div>
  </div>
  <div id="side">
    <div>
      <h2>참가 방법</h2>
      <div id="qr"></div>
      <div id="url"></div>
    </div>
    <div id="rankWrap">
      <h2>도착 순위</h2>
      <ol id="rank"></ol>
    </div>
    <div id="stageLabel" style="font-size:16px; font-weight:600; color:#8ef0c8;">1라운드 · 보통</div>
    <div id="statusBadge" style="font-size:14px; color:#f5c542;">대기 중 — 시작 전에는 참가자가 움직일 수 없음</div>
    <button id="startBtn" style="background:#1d9e75; font-weight:600;">라운드 시작</button>
    <button id="advanceBtn" style="background:#2a5da8; font-weight:600;">다음 라운드로 (상위 50%)</button>
    <button id="simBtn">150명 시뮬레이션</button>
    <button id="clearBotsBtn">봇 제거</button>
    <button id="resetBtn">전체 초기화</button>
  </div>
</div>
<div id="champion" style="display:none; position:fixed; inset:0; background:rgba(5,8,12,0.92); color:#fff; align-items:center; justify-content:center; flex-direction:column; gap:12px; z-index:10;">
  <div style="font-size:28px;">🏆 최종 우승</div>
  <div id="championName" style="font-size:48px; font-weight:700; color:#f5c542;"></div>
  <button id="championClose" style="margin-top:20px;">닫기</button>
</div>

<script>
const socket = io();
const canvas = document.getElementById('track');
const ctx = canvas.getContext('2d');
const rankEl = document.getElementById('rank');
const popup = document.getElementById('popup');

function resize(){ canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
window.addEventListener('resize', resize);
resize();

const playerUrl = location.origin + '/player.html';
document.getElementById('url').textContent = playerUrl;
new QRCode(document.getElementById('qr'), { text: playerUrl, width: 180, height: 180 });

let state = { players: [], goal: {x:0.5,y:0.1,r:0.07}, obstacles: [] };

let lastStarted = false;
socket.on('state', (s) => {
  state = s;
  if (s.started !== lastStarted) { setStatus(s.started); lastStarted = s.started; }
  document.getElementById('stageLabel').textContent = s.stageLabel;
  document.getElementById('advanceBtn').textContent = s.isLastStage ? '우승자 확정' : '다음 라운드로 (상위 50%)';
  draw();
});

socket.on('stage:change', ({ label }) => {
  document.getElementById('stageLabel').textContent = label;
  rankEl.innerHTML = '';
  setStatus(false);
});

socket.on('champion', ({ nickname }) => {
  document.getElementById('championName').textContent = nickname;
  document.getElementById('champion').style.display = 'flex';
});
document.getElementById('championClose').addEventListener('click', () => {
  document.getElementById('champion').style.display = 'none';
});

document.getElementById('advanceBtn').addEventListener('click', () => socket.emit('host:advance'));

socket.on('arrived', ({ nickname, rank, isBot }) => {
  if (!isBot) {
    popup.textContent = rank + '등 — ' + nickname;
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 2200);
  }
  renderRank();
});

socket.on('reset', (payload) => {
  rankEl.innerHTML = '';
  setStatus(false);
  if (payload && payload.stageLabel) document.getElementById('stageLabel').textContent = payload.stageLabel;
});

function setStatus(started){
  const badge = document.getElementById('statusBadge');
  if (started) {
    badge.textContent = '진행 중';
    badge.style.color = '#4da3ff';
  } else {
    badge.textContent = '대기 중 — 시작 전에는 참가자가 움직일 수 없음';
    badge.style.color = '#f5c542';
  }
}

document.getElementById('startBtn').addEventListener('click', () => socket.emit('host:start'));
document.getElementById('simBtn').addEventListener('click', () => socket.emit('host:simulate', 150));
document.getElementById('clearBotsBtn').addEventListener('click', () => socket.emit('host:clearBots'));
document.getElementById('resetBtn').addEventListener('click', () => socket.emit('host:reset'));

function renderRank(){
  const finished = state.players.filter(p => p.finished).sort((a,b) => a.rank - b.rank);
  rankEl.innerHTML = finished.map(p => '<li><span class="n">' + p.rank + '</span>' + p.nickname + '</li>').join('');
}

function draw(){
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  // 창 비율과 무관하게 항상 정사각형 판정 영역만 사용 (충돌 판정과 화면 표시를 일치시킴)
  const S = Math.min(W, H);
  const offX = (W - S) / 2;
  const offY = (H - S) / 2;
  const px = (nx) => offX + nx * S;
  const py = (ny) => offY + ny * S;
  const pr = (nr) => nr * S;

  ctx.strokeStyle = '#223';
  ctx.lineWidth = 1;
  ctx.strokeRect(offX, offY, S, S);

  // 장애물
  state.obstacles.forEach(o => {
    if (o.type === 'bounce') {
      ctx.beginPath();
      ctx.arc(px(o.x), py(o.y), pr(o.r), 0, Math.PI*2);
      ctx.fillStyle = 'rgba(212,83,126,0.35)';
      ctx.fill();
      ctx.strokeStyle = '#d4537e';
      ctx.lineWidth = 2;
      ctx.stroke();
      return;
    }
    if (o.type === 'diagWall') {
      ctx.beginPath();
      ctx.moveTo(px(o.x1), py(o.y1));
      ctx.lineTo(px(o.x2), py(o.y2));
      ctx.strokeStyle = '#3a4552';
      ctx.lineWidth = pr(o.thickness);
      ctx.lineCap = 'round';
      ctx.stroke();
      return;
    }
    ctx.fillStyle = o.type === 'wall' ? '#3a4552' : 'rgba(90,140,200,0.25)';
    ctx.fillRect(px(o.x), py(o.y), pr(o.w), pr(o.h));
  });

  // 목표
  ctx.beginPath();
  ctx.arc(px(state.goal.x), py(state.goal.y), pr(state.goal.r), 0, Math.PI*2);
  ctx.fillStyle = 'rgba(29,158,117,0.25)';
  ctx.fill();
  ctx.strokeStyle = '#1d9e75';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#8ef0c8';
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('GOAL', px(state.goal.x), py(state.goal.y) + 5);

  // 참가자 (탈락자는 표시 안 함 / 봇은 라벨 없이 작게)
  state.players.forEach(p => {
    if (p.eliminated) return;
    ctx.beginPath();
    ctx.arc(px(p.x), py(p.y), p.isBot ? 4 : 8, 0, Math.PI*2);
    ctx.fillStyle = p.finished ? '#556' : (p.isBot ? '#8899aa' : '#4da3ff');
    ctx.fill();
    if (!p.isBot) {
      ctx.fillStyle = '#cde';
      ctx.font = '12px sans-serif';
      ctx.fillText(p.nickname, px(p.x), py(p.y) - 14);
    }
  });
}
</script>
</body>
</html>
