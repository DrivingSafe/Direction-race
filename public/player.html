<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>목적지 레이스</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  html, body { margin:0; height:100%; background:#101720; color:#fff; font-family: sans-serif; overscroll-behavior:none; touch-action:none; }
  #join { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:16px; padding:24px; box-sizing:border-box; }
  #join input { font-size:18px; padding:12px; width:80%; max-width:280px; border-radius:8px; border:none; text-align:center; }
  #join button, #status { font-size:18px; padding:12px 24px; border-radius:8px; border:none; background:#4da3ff; color:#04162b; font-weight:600; }
  #pad { display:none; height:100vh; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  #status { background:transparent; color:#8ef0c8; font-size:16px; padding:4px; }
  .row { display:flex; gap:10px; }
  .btn { width:88px; height:88px; border-radius:16px; background:#223; border:1px solid #345; color:#fff; font-size:32px; display:flex; align-items:center; justify-content:center; user-select:none; }
  .btn:active { background:#345; }
  #finished { display:none; text-align:center; }
  #finished .big { font-size:40px; font-weight:700; color:#8ef0c8; }
</style>
</head>
<body>
<div id="stageBar" style="position:fixed; top:0; left:0; right:0; text-align:center; padding:8px; font-size:14px; font-weight:600; color:#8ef0c8; background:rgba(0,0,0,0.4); z-index:5;">1라운드 · 보통</div>

<div id="join" style="padding-top:36px;">
  <h2 style="margin:0;">닉네임을 입력하세요</h2>
  <input id="name" maxlength="12" placeholder="예: 김현석" />
  <button id="joinBtn">참가하기</button>
</div>

<div id="waiting" style="display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:12px; text-align:center; padding:24px; box-sizing:border-box;">
  <h2 style="margin:0;">참가 완료!</h2>
  <p id="waitingMsg" style="color:#9ab; font-size:16px;">호스트가 시작하면 바로 방향키가 나타납니다.<br>화면을 켠 채로 잠시 기다려주세요.</p>
</div>

<div id="pad">
  <div id="status">방향키로 목적지까지 이동하세요</div>
  <div class="row">
    <div style="width:88px;"></div>
    <div class="btn" data-k="up">▲</div>
    <div style="width:88px;"></div>
  </div>
  <div class="row">
    <div class="btn" data-k="left">◀</div>
    <div style="width:88px;"></div>
    <div class="btn" data-k="right">▶</div>
  </div>
  <div class="row">
    <div style="width:88px;"></div>
    <div class="btn" data-k="down">▼</div>
    <div style="width:88px;"></div>
  </div>
</div>

<div id="eliminated" style="display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:12px; text-align:center; padding:24px; box-sizing:border-box;">
  <h2 style="margin:0;">아쉽지만 탈락했습니다</h2>
  <p style="color:#9ab; font-size:16px;">다음 라운드를 응원해주세요!</p>
</div>

<div id="finished">
  <div class="big" id="rankText"></div>
  <div>도착했습니다!</div>
</div>

<script>
const socket = io();
const input = { up:false, down:false, left:false, right:false };
let myId = null;
let myNickname = null;

// 이 폰을 식별하는 고유 ID. 연결이 끊겼다 다시 붙어도 같은 사람으로 인식시키는 용도.
let clientId = localStorage.getItem('race_client_id');
if (!clientId) {
  clientId = 'c_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem('race_client_id', clientId);
}

document.getElementById('joinBtn').addEventListener('click', () => {
  myNickname = document.getElementById('name').value;
  socket.emit('join', { nickname: myNickname, clientId });
});

// 최초 접속뿐 아니라, 와이파이가 끊겼다 재연결될 때도 이 이벤트가 다시 발생함.
// 이미 참가한 적 있으면 자동으로 다시 join해서 같은 사람으로 이어서 진행.
socket.on('connect', () => {
  if (myNickname) socket.emit('join', { nickname: myNickname, clientId });
});

let iAmEliminated = false;

function showScreen(id) {
  const flexScreens = { waiting: 'flex', pad: 'flex', finished: 'block', eliminated: 'flex' };
  Object.keys(flexScreens).forEach(s => { document.getElementById(s).style.display = 'none'; });
  if (id) document.getElementById(id).style.display = flexScreens[id];
}

socket.on('joined', ({ id, finished, rank, started, eliminated, stageLabel }) => {
  myId = id;
  document.getElementById('join').style.display = 'none';
  if (stageLabel) document.getElementById('stageBar').textContent = stageLabel;
  iAmEliminated = !!eliminated;
  if (iAmEliminated) {
    showScreen('eliminated');
  } else if (finished) {
    document.getElementById('rankText').textContent = rank + '등';
    showScreen('finished');
  } else if (started) {
    showScreen('pad');
  } else {
    showScreen('waiting');
  }
});

socket.on('game:start', () => {
  if (iAmEliminated) return;
  if (document.getElementById('finished').style.display !== 'flex' && document.getElementById('finished').style.display !== 'block') {
    showScreen('pad');
  }
});

socket.on('stage:change', ({ label }) => {
  document.getElementById('stageBar').textContent = label;
  if (iAmEliminated) return;
  document.getElementById('waitingMsg').textContent = label + ' 라운드로 진출했습니다! 호스트가 시작하면 이어서 진행됩니다.';
  showScreen('waiting');
});

socket.on('eliminated', ({ ids }) => {
  if (ids.includes(clientId)) {
    iAmEliminated = true;
    showScreen('eliminated');
  }
});

socket.on('reset', ({ stageLabel } = {}) => {
  iAmEliminated = false;
  if (stageLabel) document.getElementById('stageBar').textContent = stageLabel;
  document.getElementById('waitingMsg').textContent = '호스트가 시작하면 바로 방향키가 나타납니다.';
  showScreen('waiting');
});

function sendInput(){ socket.emit('input', input); }

document.querySelectorAll('.btn').forEach(btn => {
  const k = btn.dataset.k;
  const start = (e) => { e.preventDefault(); input[k] = true; sendInput(); };
  const end = (e) => { e.preventDefault(); input[k] = false; sendInput(); };
  btn.addEventListener('touchstart', start, {passive:false});
  btn.addEventListener('touchend', end);
  btn.addEventListener('touchcancel', end);
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
});

socket.on('arrived', ({ id, rank }) => {
  if (id === clientId) {
    document.getElementById('rankText').textContent = rank + '등';
    showScreen('finished');
  }
});

socket.on('champion', ({ id }) => {
  if (id === clientId) {
    document.getElementById('rankText').textContent = '🏆 최종 우승!';
    showScreen('finished');
  }
});
</script>
</body>
</html>
